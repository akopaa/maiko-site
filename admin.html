<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ადმინ პანელი — მაიკო კაჭკაჭიშვილი</title>
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
<style>
:root {
    --gold: #BFA081;
    --dark: #1A1A1A;
    --cream: #fbf3e9;
    --wine: #5B2B36;
    --green: #1e7e45;
    --red: #b3261e;
    --blue: #1f6feb;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: "Noto Sans Georgian", sans-serif; }
body { background: #f3efe9; color: var(--dark); min-height: 100vh; }
button { cursor: pointer; }

/* login */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--dark); padding: 20px; }
.login-card { background: #fff; border-radius: 22px; padding: 40px 32px; width: 100%; max-width: 400px; box-shadow: 0 20px 45px rgba(0,0,0,.3); text-align: center; }
.login-card h1 { font-size: 20px; margin-bottom: 6px; }
.login-card p { color: #777; font-size: 13px; margin-bottom: 24px; }
.login-card input { width: 100%; border: 1px solid #ddd; border-radius: 12px; padding: 14px; font-size: 16px; margin-bottom: 14px; outline: none; }
.login-card input:focus { border-color: var(--gold); }
.big-btn { width: 100%; background: var(--dark); color: var(--gold); border: none; border-radius: 999px; padding: 15px; font-size: 15px; font-weight: 700; }
.big-btn:hover { opacity: .9; }
.login-err { color: var(--red); font-size: 13px; margin-top: 12px; display: none; }

/* app */
.topbar { background: var(--dark); color: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; position: sticky; top: 0; z-index: 10; }
.topbar h1 { font-size: 16px; color: var(--gold); }
.topbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.topbar button { background: #333; color: #fff; border: none; border-radius: 999px; padding: 9px 16px; font-size: 13px; }
.topbar button:hover { background: var(--gold); color: var(--dark); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; padding: 18px; max-width: 1100px; margin: 0 auto; }
.stat-card { background: #fff; border-radius: 16px; padding: 16px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
.stat-card .num { font-size: 30px; font-weight: 700; color: var(--wine); }
.stat-card .lbl { font-size: 12px; color: #777; margin-top: 4px; }

.tabs { display: flex; gap: 10px; padding: 0 18px; max-width: 1100px; margin: 0 auto 14px; }
.tab-btn { flex: 1; background: #fff; border: 2px solid transparent; border-radius: 14px; padding: 14px; font-size: 15px; font-weight: 700; color: #555; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
.tab-btn.active { border-color: var(--gold); color: var(--dark); background: var(--cream); }
.tab-btn .badge { background: var(--wine); color: #fff; border-radius: 999px; font-size: 12px; padding: 2px 9px; margin-left: 6px; }

.toolbar { display: flex; gap: 10px; padding: 0 18px; max-width: 1100px; margin: 0 auto 14px; flex-wrap: wrap; }
.toolbar input, .toolbar select { border: 1px solid #ddd; border-radius: 12px; padding: 11px 14px; font-size: 14px; outline: none; background: #fff; }
.toolbar input { flex: 2; min-width: 180px; }
.toolbar select { flex: 1; min-width: 140px; }

.list { max-width: 1100px; margin: 0 auto; padding: 0 18px 60px; }
.card { background: #fff; border-radius: 16px; padding: 18px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
.card .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.card .who { font-size: 16px; font-weight: 700; }
.card .meta { font-size: 13px; color: #666; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
.card .meta i { color: var(--gold); margin-right: 4px; }
.card .meta a { color: var(--blue); text-decoration: none; }
.card .msg-text { background: #faf7f2; border-radius: 10px; padding: 12px; font-size: 14px; margin-top: 10px; white-space: pre-wrap; }
.status-sel { border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 700; border: 2px solid #ddd; background: #fff; }
.status-sel.s-new { border-color: var(--blue); color: var(--blue); }
.status-sel.s-contacted, .status-sel.s-read { border-color: #b58a00; color: #b58a00; }
.status-sel.s-enrolled, .status-sel.s-replied { border-color: var(--green); color: var(--green); }
.status-sel.s-rejected { border-color: var(--red); color: var(--red); }
.status-sel.s-archived { border-color: #999; color: #999; }
.note-box { width: 100%; border: 1px dashed #ccc; border-radius: 10px; padding: 10px; font-size: 13px; margin-top: 10px; outline: none; resize: vertical; min-height: 38px; background: #fffdf8; }
.note-box:focus { border-color: var(--gold); }
.empty { text-align: center; color: #888; padding: 50px 0; font-size: 15px; }
.load-more { display: block; margin: 10px auto 0; background: #fff; border: 1px solid #ddd; border-radius: 999px; padding: 11px 26px; font-size: 14px; }
.saved-flash { color: var(--green); font-size: 12px; margin-left: 8px; opacity: 0; transition: opacity .3s; }
.saved-flash.show { opacity: 1; }

/* password modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.modal-bg.open { display: flex; }
.modal { background: #fff; border-radius: 18px; padding: 28px; width: 100%; max-width: 380px; }
.modal h2 { font-size: 16px; margin-bottom: 16px; }
.modal input { width: 100%; border: 1px solid #ddd; border-radius: 10px; padding: 12px; font-size: 14px; margin-bottom: 10px; outline: none; }
.modal .row { display: flex; gap: 10px; margin-top: 6px; }
.modal .row button { flex: 1; border-radius: 999px; padding: 11px; font-size: 14px; border: none; }
.modal .ok { background: var(--dark); color: var(--gold); font-weight: 700; }
.modal .cancel { background: #eee; }
.modal .hint { font-size: 12px; color: #888; margin-bottom: 10px; }
.footer-link { text-align: center; padding: 20px; font-size: 12px; color: #999; }
.footer-link a { color: #999; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginView">
    <div class="login-card">
        <img src="img/logo.svg" alt="" style="width:120px;margin-bottom:14px">
        <h1>ადმინ პანელი</h1>
        <p>შეიყვანეთ პაროლი შესასვლელად</p>
        <form id="loginForm">
            <input type="password" id="loginPwd" placeholder="პაროლი" autocomplete="current-password" required>
            <button type="submit" class="big-btn">შესვლა</button>
        </form>
        <div class="login-err" id="loginErr">პაროლი არასწორია</div>
    </div>
</div>

<!-- APP -->
<div id="appView" style="display:none">
    <div class="topbar">
        <h1><i class="ri-music-2-line"></i> ჩემი საიტის მართვა</h1>
        <div class="actions">
            <button id="btnRefresh"><i class="ri-refresh-line"></i> განახლება</button>
            <button id="btnExport"><i class="ri-file-excel-2-line"></i> Excel-ში გადმოწერა</button>
            <button id="btnLogout"><i class="ri-logout-box-r-line"></i> გასვლა</button>
        </div>
    </div>

    <div class="stats" id="statsRow"></div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="registrations">რეგისტრაციები <span class="badge" id="regBadge">0</span></button>
        <button class="tab-btn" data-tab="messages">შეტყობინებები <span class="badge" id="msgBadge">0</span></button>
    </div>

    <div class="toolbar">
        <input type="text" id="searchBox" placeholder="ძებნა — სახელი, ტელეფონი...">
        <select id="statusFilter"></select>
    </div>

    <div class="list" id="listBox"></div>

    <div class="footer-link"><a href="#" id="btnChangePwd">პაროლის შეცვლა</a></div>
</div>

<!-- CHANGE PASSWORD -->
<div class="modal-bg" id="pwdModal">
    <div class="modal">
        <h2>პაროლის შეცვლა</h2>
        <div class="hint">ახალი პაროლი უნდა იყოს მინიმუმ 8 სიმბოლო. ჩაიწერეთ უსაფრთხო ადგილას.</div>
        <input type="password" id="oldPwd" placeholder="ძველი პაროლი">
        <input type="password" id="newPwd" placeholder="ახალი პაროლი">
        <input type="password" id="newPwd2" placeholder="გაიმეორეთ ახალი პაროლი">
        <div class="row">
            <button class="cancel" id="pwdCancel">გაუქმება</button>
            <button class="ok" id="pwdSave">შენახვა</button>
        </div>
    </div>
</div>

<script>
const API = "https://br-young-dawn-b1rhi5yl-api.compute.c-5.eu-central-1.aws.neon.tech";
let token = localStorage.getItem("admin_token") || "";
let tab = "registrations";
let offset = 0;
const LIMIT = 30;

const DIR_LABELS = {
    group_vocal: "ჯგუფური ვოკალი",
    individual_vocal: "ინდივიდუალური ვოკალი",
    folk_song: "ხალხური სიმღერა",
    piano: "ფორტეპიანო",
    composition: "კომპოზიცია",
    other: "სხვა"
};
const REG_STATUS = { new: "ახალი", contacted: "დავუკავშირდი", enrolled: "ჩაირიცხა", rejected: "არ ჩაირიცხა", archived: "არქივი" };
const MSG_STATUS = { new: "ახალი", read: "წაკითხული", replied: "ვუპასუხე", archived: "არქივი" };

const $ = (id) => document.getElementById(id);

function fmtDate(s) {
    const d = new Date(s.replace(" ", "T"));
    return d.toLocaleDateString("ka-GE", { day: "numeric", month: "long", year: "numeric" }) +
        " · " + d.toLocaleTimeString("ka-GE", { hour: "2-digit", minute: "2-digit" });
}

async function api(path, opts = {}) {
    const res = await fetch(API + path, {
        ...opts,
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token, ...(opts.headers || {}) }
    });
    if (res.status === 401) { logout(); throw new Error("unauthorized"); }
    return res.json();
}

function logout() {
    token = "";
    localStorage.removeItem("admin_token");
    $("appView").style.display = "none";
    $("loginView").style.display = "flex";
}

/* ---------- login ---------- */
$("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("loginErr").style.display = "none";
    try {
        const res = await fetch(API + "/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: $("loginPwd").value })
        });
        const data = await res.json();
        if (data.ok) {
            token = data.token;
            localStorage.setItem("admin_token", token);
            $("loginPwd").value = "";
            enter();
        } else {
            $("loginErr").textContent = data.error || "პაროლი არასწორია";
            $("loginErr").style.display = "block";
        }
    } catch {
        $("loginErr").textContent = "კავშირის შეცდომა — სცადეთ თავიდან";
        $("loginErr").style.display = "block";
    }
});

function enter() {
    $("loginView").style.display = "none";
    $("appView").style.display = "block";
    loadStats();
    setFilterOptions();
    loadList(true);
}

/* ---------- stats ---------- */
async function loadStats() {
    try {
        const s = await api("/admin/stats");
        if (!s.ok) return;
        const regTotal = Object.values(s.registrations).reduce((a, b) => a + b, 0);
        const msgTotal = Object.values(s.messages).reduce((a, b) => a + b, 0);
        $("regBadge").textContent = s.registrations.new || 0;
        $("msgBadge").textContent = s.messages.new || 0;
        $("statsRow").innerHTML = `
            <div class="stat-card"><div class="num">${regTotal}</div><div class="lbl">სულ რეგისტრაცია</div></div>
            <div class="stat-card"><div class="num">${s.registrations.new || 0}</div><div class="lbl">ახალი განაცხადი</div></div>
            <div class="stat-card"><div class="num">${s.last7days}</div><div class="lbl">ბოლო 7 დღეში</div></div>
            <div class="stat-card"><div class="num">${s.registrations.enrolled || 0}</div><div class="lbl">ჩარიცხული</div></div>
            <div class="stat-card"><div class="num">${msgTotal}</div><div class="lbl">შეტყობინება</div></div>`;
    } catch {}
}

/* ---------- tabs / filters ---------- */
document.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    tab = b.dataset.tab;
    $("searchBox").value = "";
    setFilterOptions();
    loadList(true);
}));

function setFilterOptions() {
    const st = tab === "registrations" ? REG_STATUS : MSG_STATUS;
    $("statusFilter").innerHTML = '<option value="">ყველა სტატუსი</option>' +
        Object.entries(st).map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
}

let searchTimer;
$("searchBox").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => loadList(true), 350); });
$("statusFilter").addEventListener("change", () => loadList(true));
$("btnRefresh").addEventListener("click", () => { loadStats(); loadList(true); });
$("btnLogout").addEventListener("click", logout);
$("btnExport").addEventListener("click", () => {
    window.open(API + "/admin/export?type=" + tab + "&token=" + encodeURIComponent(token), "_blank");
});

/* ---------- list ---------- */
async function loadList(reset) {
    if (reset) { offset = 0; $("listBox").innerHTML = '<div class="empty">იტვირთება...</div>'; }
    const q = encodeURIComponent($("searchBox").value.trim());
    const st = $("statusFilter").value;
    try {
        const data = await api(`/admin/${tab}?q=${q}&status=${st}&limit=${LIMIT}&offset=${offset}`);
        if (!data.ok) return;
        const cards = data.rows.map(tab === "registrations" ? regCard : msgCard).join("");
        if (reset) $("listBox").innerHTML = cards || '<div class="empty">ჩანაწერები არ არის</div>';
        else {
            $("listBox").querySelector(".load-more")?.remove();
            $("listBox").insertAdjacentHTML("beforeend", cards);
        }
        offset += data.rows.length;
        if (offset < data.total) {
            $("listBox").insertAdjacentHTML("beforeend", `<button class="load-more">მეტის ჩატვირთვა (${data.total - offset})</button>`);
            $("listBox").querySelector(".load-more").addEventListener("click", () => loadList(false));
        }
        bindCards();
    } catch {}
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function statusSelect(type, id, current) {
    const st = type === "registrations" ? REG_STATUS : MSG_STATUS;
    return `<select class="status-sel s-${current}" data-type="${type}" data-id="${id}">` +
        Object.entries(st).map(([v, l]) => `<option value="${v}" ${v === current ? "selected" : ""}>${l}</option>`).join("") +
        `</select><span class="saved-flash">✓ შენახულია</span>`;
}

function regCard(r) {
    return `<div class="card">
        <div class="row1">
            <div class="who">${esc(r.full_name)} · ${r.age} წლის</div>
            ${statusSelect("registrations", r.id, r.status)}
        </div>
        <div class="meta">
            <span><i class="ri-music-2-line"></i>${DIR_LABELS[r.direction] || esc(r.direction)}</span>
            <span><i class="ri-phone-line"></i><a href="tel:${esc(r.phone).replace(/\s/g, "")}">${esc(r.phone)}</a></span>
            <span><i class="ri-map-pin-line"></i>${esc(r.address)}</span>
            ${r.parent_full_name ? `<span><i class="ri-parent-line"></i>მშობელი: ${esc(r.parent_full_name)}</span>` : ""}
            <span><i class="ri-calendar-line"></i>${fmtDate(r.created_at)}</span>
        </div>
        <textarea class="note-box" data-type="registrations" data-id="${r.id}" placeholder="ჩემი შენიშვნა... (ავტომატურად ინახება)">${esc(r.admin_note || "")}</textarea>
    </div>`;
}

function msgCard(m) {
    return `<div class="card">
        <div class="row1">
            <div class="who">${esc(m.name_surname)}</div>
            ${statusSelect("messages", m.id, m.status)}
        </div>
        <div class="meta">
            <span><i class="ri-flag-line"></i>${esc(m.subject)}</span>
            <span><i class="ri-phone-line"></i><a href="tel:${esc(m.phone).replace(/\s/g, "")}">${esc(m.phone)}</a></span>
            <span><i class="ri-mail-line"></i><a href="mailto:${esc(m.email)}">${esc(m.email)}</a></span>
            <span><i class="ri-calendar-line"></i>${fmtDate(m.created_at)}</span>
        </div>
        <div class="msg-text">${esc(m.message)}</div>
        <textarea class="note-box" data-type="messages" data-id="${m.id}" placeholder="ჩემი შენიშვნა... (ავტომატურად ინახება)">${esc(m.admin_note || "")}</textarea>
    </div>`;
}

function bindCards() {
    document.querySelectorAll(".status-sel").forEach(sel => {
        if (sel._bound) return; sel._bound = true;
        sel.addEventListener("change", async () => {
            sel.className = "status-sel s-" + sel.value;
            await api(`/admin/${sel.dataset.type}/${sel.dataset.id}`, { method: "PATCH", body: JSON.stringify({ status: sel.value }) });
            flash(sel.nextElementSibling);
            loadStats();
        });
    });
    document.querySelectorAll(".note-box").forEach(box => {
        if (box._bound) return; box._bound = true;
        box.addEventListener("blur", async () => {
            await api(`/admin/${box.dataset.type}/${box.dataset.id}`, { method: "PATCH", body: JSON.stringify({ admin_note: box.value }) });
        });
    });
}
function flash(el) { if (!el) return; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1500); }

/* ---------- change password ---------- */
$("btnChangePwd").addEventListener("click", (e) => { e.preventDefault(); $("pwdModal").classList.add("open"); });
$("pwdCancel").addEventListener("click", () => $("pwdModal").classList.remove("open"));
$("pwdSave").addEventListener("click", async () => {
    if ($("newPwd").value !== $("newPwd2").value) { alert("ახალი პაროლები არ ემთხვევა"); return; }
    const data = await api("/admin/password", {
        method: "POST",
        body: JSON.stringify({ old_password: $("oldPwd").value, new_password: $("newPwd").value })
    });
    if (data.ok) {
        alert("პაროლი შეიცვალა ✓");
        $("pwdModal").classList.remove("open");
        $("oldPwd").value = $("newPwd").value = $("newPwd2").value = "";
    } else {
        alert(data.error || "შეცდომა");
    }
});

/* ---------- boot ---------- */
if (token) {
    api("/admin/stats").then(s => { if (s.ok) enter(); else logout(); }).catch(() => {});
}
</script>
</body>
</html>
